apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
      annotations:
        checksum/page: {{ .Values.title }}{{ .Values.banner }}{{ .Values.global.environment }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          resources: {{ toJson .Values.resources }}
          volumeMounts: [{ name: page, mountPath: /usr/share/nginx/html }]
      volumes:
        - name: page
          configMap: { name: {{ .Release.Name }} }
