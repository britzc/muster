# preview: an instance per branch, each stack in a namespace of its own, which
# the instance's teardown deletes.
apiVersion: muster/v1alpha1
cluster:
  context: minikube           # point this at your review cluster's kube context
namespace: "{stack}-{env}-{instance}"
helm:
  timeout: 3m
  createNamespace: true       # each instance creates its namespace
values:
  global:
    environment: preview
