apiVersion: muster/v1alpha1
bases: [temp-base]              # what each branch's instance is built from; never deployed itself
tiers:                          # kinds of environment, in deploy order: a pipeline stage each
  - name: development
    environments:
      dev: {}
  - name: review
    ephemeral: true             # an instance per branch: muster … --instance <branch>
    environments:
      temp: { base: temp-base } # no files of its own: all from temp-base
  - name: testing
    environments:
      qa: { from: dev }         # qa takes only what passed in dev
  - name: production
    production: true            # no mocks, --confirm to uninstall, manual jobs by default
    environments:
      prod: { from: qa }        # prod takes only what passed in qa
