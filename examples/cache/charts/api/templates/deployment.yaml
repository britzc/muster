apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          args:
            - -listen=:5678
            - -text=api in {{ .Values.global.environment }}, cache at {{ .Values.cache.host }}:{{ .Values.cache.port }} (tls {{ .Values.cache.tls }})
          env:
            - { name: REDIS_HOST, value: {{ .Values.cache.host | quote }} }
            - { name: REDIS_PORT, value: {{ .Values.cache.port | quote }} }
            - { name: REDIS_TLS,  value: {{ .Values.cache.tls | quote }} }
          ports: [{ containerPort: 5678 }]
          resources: {{ toJson .Values.resources }}
