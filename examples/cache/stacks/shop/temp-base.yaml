# The shop in each branch's instance: Postgres and Redis in the instance's
# namespace, small, where prod has RDS and ElastiCache.
apiVersion: muster/v1alpha1
members:
  db:    { provider: postgres }   # dropped with the instance
  cache: { provider: redis }
values:
  cache:                      # the redis chart's values
    maxmemory: 16mb
