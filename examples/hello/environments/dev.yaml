apiVersion: muster/v1alpha1
cluster:
  context: minikube               # the dev cluster's kube context; all minikube here
namespace: "{stack}-{env}"
helm:
  wait: true
  timeout: 3m
  createNamespace: true
values:                         # every release in dev
  global:
    environment: dev
    imagePullPolicy: IfNotPresent   # images are built into minikube, or pulled once
