apiVersion: muster/v1alpha1
production: true
versions:
  tags: '[0-9]+\.[0-9]+\.[0-9]+(-alpine)?'   # release tags only
promotion:
  from: qa                      # prod takes only what passed in qa; manual, as production
cluster:
  context: minikube               # the prod cluster's kube context; all minikube here
namespace: "{stack}-{env}"
helm:
  wait: true
  timeout: 3m
  createNamespace: true
values:                         # every release in prod
  global:
    environment: prod
    imagePullPolicy: IfNotPresent   # images are built into minikube, or pulled once
