apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
      annotations: { checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }} }
    spec:
      {{- if or .Values.init.enabled .Values.sidecar.enabled }}
      initContainers:
        {{- if .Values.init.enabled }}
        # Runs once before web starts: records when the pod started.
        - name: init
          image: "{{ .Values.init.image.repository }}:{{ .Values.init.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.init.image.pullPolicy }}
          command: ["sh", "-c", "date -u > /shared/started-at"]
          volumeMounts: [{ name: shared, mountPath: /shared }]
        {{- end }}
        {{- if .Values.sidecar.enabled }}
        # A native sidecar (Kubernetes 1.29+): starts before web and runs beside it,
        # serving the shared folder on port 8081.
        - name: sidecar
          image: "{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.sidecar.image.pullPolicy }}
          restartPolicy: Always
          command: ["httpd", "-f", "-p", "8081", "-h", "/shared"]
          ports: [{ containerPort: 8081 }]
          volumeMounts: [{ name: shared, mountPath: /shared }]
        {{- end }}
      {{- end }}
      volumes:
        - name: shared
          emptyDir: {}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: MESSAGE,     value: {{ .Values.message | quote }} }
            - { name: ENVIRONMENT, value: {{ .Values.global.environment | quote }} }
            - { name: VERSION,     value: {{ .Values.image.tag | quote }} }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}, key: apiKey } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
