# The hello repository's pipeline. Every environment, stack and app comes from
# muster list, so nothing here names one: adding an environment or a stack to
# the repository adds it to the pipeline.
#
#   merge request   validate, and print every deploy as the matrix's jobs
#                   (--yes=false: nothing changes, no deployment recorded)
#   main            deploy every stack along the chain dev, qa, prod: each
#                   stack in an environment only after it deployed in the one
#                   before; dev and qa right away, prod as manual jobs
#   Run pipeline    choose what to deploy, uninstall, restart, promote or
#                   roll back; manual jobs to start
#   API             the same inputs, from another system such as a customer
#                   app (POST /projects/:id/pipeline with inputs); jobs start
#                   themselves except in manual environments
#   trigger         an app's pipeline ships a new image, or rolls one back
#                   (see plan below)
#   schedule        a pipeline schedule that sets the action input to promote
#                   promotes along the chain, e.g. nightly into qa
#
# The order of environments is in the repository: the tiers in muster.yaml,
# a stage each, and each environment's from (qa from dev, prod from qa).
# manual says whether a person starts an environment's jobs; by default the
# production ones.
#
# Only the default branch (main) deploys to every environment. A pipeline run
# by hand from another branch offers only the non-production environments, for
# testing a branch. Protect the production environments in GitLab (Settings >
# CI/CD > Protected environments) to enforce it there too, and add required
# approvals to have their jobs wait for an approver.
#
# The image is built from Muster's Dockerfile: muster, helm with the
# helm-secrets plugin, sops, kubectl and git.
#
# Secrets: stacks/hello/<env>.web.secrets.yaml are SOPS-encrypted. muster
# deploy passes them to helm as -f secrets://…, and helm-secrets decrypts them
# with the age key in SOPS_AGE_KEY_FILE. Here that is the example's demo key;
# in a real repo, add a GitLab CI/CD variable SOPS_AGE_KEY_FILE of type File
# (protected and masked where it can be), which takes precedence over the one
# below, and never commit the key.
#
# Cluster access comes from the job's kubeconfig; Muster only names the
# context (cluster.context in environments/<env>.yaml). Either:
#   - the GitLab agent for Kubernetes: set cluster.context to the agent's
#     context, e.g. "platform/agents:qa", and GitLab provides the kubeconfig; or
#   - a CI/CD variable KUBECONFIG of type File, holding contexts with the
#     names used in environments/*.yaml.
# Each environment can be a different cluster: every job deploys to one
# environment and names its context. A step that needs the context before
# Muster runs, such as a login that writes the kubeconfig, gets it with
#   muster list environments --env "${CI_ENVIRONMENT_NAME%%/*}" --get context
# (%%/* drops a branch instance's name: preview/pr-142 is preview). It fails
# when the environment names no context, so kubectl never falls back to the
# active one. The child pipeline's jobs don't inherit default: or
# before_script from this file, so they can't run such a step yet: give them
# the kubeconfig with one of the two ways above.
#
# Shipping and promoting commits stacks/<stack>/<env>.versions.yaml back to
# the repository, once each environment's deploy has passed: ci/versions.sh
# does the git, and needs a project access token with write_repository, in
# the masked variable DEPLOY_TOKEN.

spec:
  inputs:
    action:
      description: Deploy, uninstall (protected releases, like databases, are always kept), restart, promote each environment's versions from the one before and deploy them, or roll an app back to an older version in one environment (app, version, current and to)
      options: [deploy, uninstall, restart, promote, rollback]
      default: deploy
    deploy:
      description: A job per stack, per app (in every stack that has it), or per cell (an app in one stack); the cells of a named stack or app with cell, and always when both are named
      options: [stack, app, cell]
      default: stack
    stack:
      description: "One stack, through every environment that hosts it; empty for every stack"
      default: ""
    app:
      description: "One app, through every environment that deploys it; empty for every app"
      default: ""
    version:
      description: "With an app: a tag[@digest] to deploy in dev instead of the repository's version, for testing, not committed; with rollback, the older version to go back to"
      default: ""
    current:
      description: "With rollback: the version it replaces, as you last saw it; nothing changes where the environment runs another"
      default: ""
    to:
      description: "Only this environment and the ones before it on its chain, e.g. qa for dev and qa; empty for every environment. With rollback, the environment to roll back"
      default: ""
    accept:
      description: "Write a version a rollback rejected: promote or ship it again, or roll back to it"
      type: boolean
      default: false
---

default:
  image: registry.example.com/platform/muster:1

variables:
  # Environments this pipeline never deploys to, space-separated, e.g. a
  # "local" environment on a laptop. hello deploys to all of dev, qa and prod.
  SKIP_ENVIRONMENTS: ""
  # The age key helm-secrets decrypts the secrets files with (see above).
  # Child pipelines inherit it.
  SOPS_AGE_KEY_FILE: $CI_PROJECT_DIR/sops-demo.agekey

stages: [check, deploy]

# Every merge request and main: the whole repository is valid. A merge
# request's matrix (below) then prints every deploy.
check:
  stage: check
  script:
    - muster validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The matrix, as a child pipeline that muster generate gitlab-ci writes: a
# job per cell, each deploy after the same stack's in the environment before
# (muster generate gitlab-ci --help).
#   merge request  every stack in every environment, printed only
#                (--yes=false): each job shows the helm calls a deploy would
#                make, so a review sees what the change does where
#   main         every stack in every environment; jobs start themselves
#                except in manual environments (--auto)
#   trigger      ship APP: set TAG (and CHART) in dev, deploy, commit; then
#                promote it to qa, deploy, commit; prod waits for a person.
#                A failed deploy commits nothing and stops what comes after.
#                TO stops it at an environment (TO=dev: dev only).
#                ACTION=rollback: APP back to TAG in TO alone, replacing
#                CURRENT, which TO then rejects: no promote brings it back.
#                ACCEPT=true writes a rejected version all the same.
#   schedule     promote along the chain, starting itself where it may
#   Run pipeline the inputs' choice, every job manual:
#     stack              a job per stack each environment hosts
#     app                a job per app each environment deploys
#     stack named        a job per environment that hosts the stack
#     app named          a job per environment that deploys the app
#     cell, or both      a job per app in each stack (--by cell)
#     app and version    a job in dev, setting the version first (not
#                        committed)
#     promote            a job per stack each environment with a from
#                        (muster.yaml) hosts: promote, deploy, commit
#     rollback           a job in to: the app back to version, rejecting
#                        current; deploy, commit. In production, starting
#                        the job confirms it
#   API          the inputs, as Run pipeline, with jobs that start themselves
#                except in manual environments
# Off the default branch only the non-production environments
# (--production=false), and never SKIP_ENVIRONMENTS. Every job has a timeout
# from the helm timeouts it runs. A rejected version (after a rollback) is
# kept out of its environment until a request accepts it (accept, ACCEPT).
plan:
  stage: check
  variables:
    ACTION: $[[ inputs.action ]]
    DEPLOY: $[[ inputs.deploy ]]
    STACK_INPUT: $[[ inputs.stack ]]
    APP_INPUT: $[[ inputs.app ]]
    VERSION: $[[ inputs.version ]]
    CURRENT_INPUT: $[[ inputs.current ]]
    TO_INPUT: $[[ inputs.to ]]
    ACCEPT_INPUT: $[[ inputs.accept ]]
  script:
    - |
      case "$CI_PIPELINE_SOURCE" in
        merge_request_event)
          set -- --yes=false --auto ;;
        trigger)
          set -- --app "$APP" --auto --commit ci/versions.sh
          if [ "${ACTION:-}" = rollback ]; then set -- "$@" --action rollback --current "${CURRENT:-}"; fi
          if [ -n "${STACK:-}" ]; then set -- "$@" --stack "$STACK" --by cell; fi
          if [ -n "${TAG:-}" ]; then set -- "$@" --tag "$TAG${DIGEST:+@$DIGEST}"; fi
          if [ -n "${CHART:-}" ]; then set -- "$@" --chart "$CHART"; fi
          if [ -n "${TO:-}" ]; then set -- "$@" --to "$TO"; fi
          if [ "${ACCEPT:-}" = true ]; then set -- "$@" --accept; fi ;;
        *)
          set -- --action "$ACTION"
          if [ -n "$STACK_INPUT" ]; then set -- "$@" --stack "$STACK_INPUT"; fi
          if [ -n "$APP_INPUT" ]; then set -- "$@" --app "$APP_INPUT"; fi
          if [ "$DEPLOY" = cell ] || { [ -n "$STACK_INPUT" ] && [ -n "$APP_INPUT" ]; }; then
            set -- "$@" --by cell
          elif [ -z "$STACK_INPUT$APP_INPUT" ]; then
            set -- "$@" --by "$DEPLOY"
          fi
          if [ -n "$VERSION" ]; then set -- "$@" --tag "$VERSION"; fi
          if [ -n "$CURRENT_INPUT" ]; then set -- "$@" --current "$CURRENT_INPUT"; fi
          if [ "$ACTION" = promote ] || [ "$ACTION" = rollback ]; then set -- "$@" --commit ci/versions.sh; fi
          if [ -n "$TO_INPUT" ]; then set -- "$@" --to "$TO_INPUT"; fi
          if [ "$ACCEPT_INPUT" = true ]; then set -- "$@" --accept; fi
          if [ "$CI_PIPELINE_SOURCE" != web ]; then set -- "$@" --auto; fi ;;
      esac
      # Printing changes nothing, so a merge request shows production too.
      if [ "$CI_PIPELINE_SOURCE" != merge_request_event ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        set -- "$@" --production=false
      fi
      for env in $SKIP_ENVIRONMENTS; do set -- "$@" --skip "$env"; done
      muster generate gitlab-ci "$@" --image "$CI_JOB_IMAGE" > matrix.yml
    - cat matrix.yml
  artifacts:
    paths: [matrix.yml]
  rules: &matrix
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # From an app's pipeline, TAG is the app's image (the one named app when it
    # has several; set the others by name with muster versions set
    # web.sidecar=…), DIGEST optional and passed on unchecked, CHART the
    # version of an app's chart in a registry (oci://… or https://… in its
    # app.yaml), STACK optional: ship it in that stack alone (a job per cell):
    #   curl -X POST -F token=$TRIGGER_TOKEN -F ref=main \
    #     -F "variables[APP]=payments" -F "variables[TAG]=1.4.2" -F "variables[DIGEST]=sha256:…" \
    #     -F "variables[CHART]=1.4.2" -F "variables[TO]=qa" \
    #     https://gitlab.example.com/api/v4/projects/<id>/trigger/pipeline
    # Rolling back takes ACTION=rollback, TAG the older version, CURRENT the
    # one it replaces, and TO the environment:
    #     -F "variables[ACTION]=rollback" -F "variables[APP]=payments" \
    #     -F "variables[TAG]=1.4.1" -F "variables[CURRENT]=1.4.2" -F "variables[TO]=prod"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $APP && ($TAG || $CHART)

matrix:
  stage: deploy
  needs: [plan]
  trigger:
    include:
      - artifact: matrix.yml
        job: plan
  rules: *matrix
